<!doctype html><html><body style="margin:0;background:#ccc"><canvas id="sheet"></canvas>
<script type="module">
import { ACESFilmicToneMapping, Color, DirectionalLight, HemisphereLight, PMREMGenerator, PerspectiveCamera, Scene, SRGBColorSpace, Vector3, WebGLRenderer } from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { HumanAvatar, loadHumanPackage } from 'humanforge/human';
const qp = new URLSearchParams(location.search);
const list = JSON.parse(decodeURIComponent(qp.get('cfg')));
const pkg = await loadHumanPackage('/scratch/human');
const cw=260, ch=440, cols=Math.min(list.length,6);
const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = SRGBColorSpace; renderer.toneMapping = ACESFilmicToneMapping; renderer.setSize(cw, ch, false);
const scene = new Scene(); scene.background = new Color('#d8dde4');
scene.environment = new PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
const key = new DirectionalLight('#fff4e8', 1.6); key.position.set(1.2, 2.2, 2.5); const rim = new DirectionalLight('#dfe8ff', 0.9); rim.position.set(-2, 2, -2);
scene.add(key, rim, new HemisphereLight('#ffffff', '#b9a99a', 0.4));
const camera = new PerspectiveCamera(24, cw / ch, 0.05, 50);
const avatar = new HumanAvatar(pkg); avatar.textureSize='1k'; scene.add(avatar.group);
const sheet = document.getElementById('sheet'); sheet.width = cols*cw; sheet.height = Math.ceil(list.length/cols)*(ch+20);
const g = sheet.getContext('2d');
for (const [i,c] of list.entries()) {
  await avatar.setConfig(c);
  const m = avatar.metrics(); const target = new Vector3(0, m.height*0.52, 0); const dist = m.height*1.1/2/Math.tan(12*Math.PI/180);
  camera.position.set(Math.sin(0.4)*dist, target.y, Math.cos(0.4)*dist); camera.lookAt(target); renderer.render(scene, camera);
  const x=(i%cols)*cw, y=Math.floor(i/cols)*(ch+20); g.drawImage(renderer.domElement, x, y); g.fillStyle='#000'; g.font='12px sans-serif'; g.fillText((c.label||c.clothes.join(',')), x+4, y+ch+14);
}
window.__ready = true;
</script></body></html>
